services:
    php:
        build:
            context: ./docker/php
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - redis
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
    mysql:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - mysql_data:/var/lib/mysql
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
    stripe:
        image: stripe/stripe-cli
        command: listen --forward-to php:8000/stripe/webhook
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET}
        depends_on:
            - php

volumes:
    mysql_data:
