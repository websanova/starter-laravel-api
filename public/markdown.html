<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Viewer</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #59636e;
            --border: #d1d9e0;
            --code-bg: #f6f8fa;
            --link: #0969da;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #9198a1;
                --border: #3d444d;
                --code-bg: #161b22;
                --link: #4493f8;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0rem 1rem 6rem;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        main {
            max-width: 100%;
            margin: 0 auto;
        }

        h1, h2, h3 {
            line-height: 1.25;
            margin: 2rem 0 1rem;
        }

        h1 {
            font-size: 1.9rem;
        }

        h2 {
            font-size: 1.45rem;
            padding-bottom: .3rem;
            border-bottom: 1px solid var(--border);
        }

        h3 {
            font-size: 1.15rem;
        }

        a {
            color: var(--link);
        }

        code {
            background: var(--code-bg);
            border-radius: 4px;
            padding: .15em .35em;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .9em;
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
        }

        pre code {
            background: none;
            padding: 0;
        }

        blockquote {
            margin: 1rem 0;
            padding-left: 1rem;
            border-left: 3px solid var(--border);
            color: var(--muted);
        }

        /* Tables and diagrams scroll inside their own box so the page never does. */
        .scroll-x {
            overflow-x: auto;
            margin: 1rem 0;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid var(--border);
            padding: .4rem .7rem;
            text-align: left;
        }

        pre.mermaid {
            background: none;
            border: 0;
            padding: 0;
            text-align: left;
            overflow-x: auto;
        }

        pre.mermaid svg {
            height: auto;
        }

        .error {
            border: 1px solid var(--border);
            border-left: 3px solid #d1242f;
            border-radius: 6px;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <main id="doc">Loading...</main>

    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15/lib/marked.esm.js';
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

        const el = document.getElementById('doc');

        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        mermaid.initialize({
            startOnLoad: false,
            theme: dark ? 'dark' : 'default',
            themeVariables: { fontSize: '12px' },
            flowchart: { useMaxWidth: false, padding: 8, nodeSpacing: 40, rankSpacing: 60 },
            sequence: { useMaxWidth: false }
        });

        const fail = (title, detail) => {
            el.innerHTML = '<div class="error"><strong>' + title + '</strong><p>' + detail + '</p></div>';
        };

        const name = new URLSearchParams(location.search).get('doc');

        if (! name || name.includes('/') || name.includes('..')) {
            fail('No doc specified', 'Pass a filename with <code>?doc=filename.md</code>');
        }
        else {
            try {
                const res = await fetch('storage/docs/' + name);

                if (!res.ok) {
                    throw new Error(res.status + ' ' + res.statusText);
                }

                el.innerHTML = marked.parse(await res.text());

                // marked emits <pre><code class="language-mermaid">, mermaid wants <pre class="mermaid">.
                el.querySelectorAll('pre > code.language-mermaid').forEach(code => {
                    const pre = document.createElement('pre');
                    pre.className = 'mermaid';
                    pre.textContent = code.textContent;
                    code.parentElement.replaceWith(pre);
                });

                el.querySelectorAll('table').forEach(table => {
                    const wrap = document.createElement('div');
                    wrap.className = 'scroll-x';
                    table.replaceWith(wrap);
                    wrap.appendChild(table);
                });

                await mermaid.run({ nodes: el.querySelectorAll('pre.mermaid') });
            }
            catch (e) {
                fail('Could not load ' + name, e.message
                    + '<br>Check the file exists in <code>docs/</code> and that the '
                    + '<code>storage/app/public/docs</code> symlink has been created. '
                    + 'See <code>docs/markdown-viewer.md</code>.');
            }
        }
    </script>
</body>
</html>
